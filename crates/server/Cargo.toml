[package]
name = "typeset-server"
description = "Typeset sync server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
typeset-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "limit", "compression-gzip", "compression-br"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ttf-parser = "0.25"
tokio-util = { version = "0.7", features = ["io"] }
