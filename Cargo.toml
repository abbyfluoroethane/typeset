[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
typeset-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Release profile used by the Tauri bundle (see https://tauri.app/concept/size/)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
